name: Alpha Vantage ingest

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Space-separated tickers (blank = all active)"
        required: false
        default: ""
      only:
        description: "Comma list of jobs, e.g. prices,quote (blank = all that are due)"
        required: false
        default: ""
      force:
        description: "Refetch everything for the chosen tickers, even if up to date"
        type: boolean
        default: false
  # Weekdays at 3am Pacific Standard Time, long after the close, so each morning is ready
  # with the previous day's data. GitHub schedules are in UTC and do not follow daylight
  # saving: 11:00 UTC is 3am PST in winter and 4am PDT in summer. Each run only fetches
  # what is due: quotes every run, statements only after a company has reported.
  schedule:
    - cron: "0 11 * * 1-5"

# Never let two runs overlap (a manual run during a scheduled one): they share one
# Alpha Vantage rate limit. The second waits for the first.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/requirements.txt
      - run: pip install -r ingest/requirements.txt
      - name: Run ingest
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          AV_CALLS_PER_MINUTE: ${{ vars.AV_CALLS_PER_MINUTE || '5' }}
          SYMBOLS: ${{ inputs.symbols }}
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force }}
        run: |
          ARGS=()
          if [ -n "$ONLY" ]; then ARGS+=(--only "$ONLY"); fi
          if [ "$FORCE" = "true" ]; then ARGS+=(--force); fi
          python ingest/av_ingest.py "${ARGS[@]}" $SYMBOLS
