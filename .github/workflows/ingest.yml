name: Alpha Vantage ingest

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Only these tickers, space-separated (blank = all active). A new ticker gets everything; others only what is due."
        required: false
        default: ""
      only:
        description: "Comma list of jobs, e.g. prices,quote (blank = all that are due)"
        required: false
        default: ""
      force:
        description: "Refetch everything, even what is up to date (for the tickers above, or for all if blank)"
        type: boolean
        default: false
  # Every market evening, Mon-Fri, which is Tuesday to Saturday in UTC (00:30 UTC is 8:30pm
  # EDT in summer and 7:30pm EST in winter). The quote probe (Oct 2026) showed Alpha Vantage's
  # quote is not final until about 7pm Eastern: 40% final at 5pm, 80% at 6:30pm, 100% from 7pm.
  # 00:30 UTC is after that on both sides of the clock change (UTC does not follow daylight
  # saving). It also survives GitHub's habit of starting scheduled runs hours late: a delay only
  # pushes the run later, whereas the old 11:00 UTC (7am ET) slot slid past the 9:30am open
  # and stored intraday prices as if they were closes. Each run only fetches what is due:
  # quotes every run, statements only after a company has reported.
  schedule:
    - cron: "30 0 * * 2-6"

# Never let two runs overlap (a manual run during a scheduled one): they share one
# Alpha Vantage rate limit. The second waits for the first.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/requirements.txt
      - run: pip install -r ingest/requirements.txt
      - name: Run ingest
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          AV_CALLS_PER_MINUTE: ${{ vars.AV_CALLS_PER_MINUTE || '5' }}
          SYMBOLS: ${{ inputs.symbols }}
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force }}
        run: |
          ARGS=()
          if [ -n "$ONLY" ]; then ARGS+=(--only "$ONLY"); fi
          if [ "$FORCE" = "true" ]; then ARGS+=(--force); fi
          python ingest/av_ingest.py "${ARGS[@]}" $SYMBOLS
      # Optional: email the summary and the log after every run. Does nothing until the
      # SMTP_USER, SMTP_PASSWORD and REPORT_TO secrets exist (see README). A problem with
      # the email never turns the run red.
      - name: Email the report
        if: always()
        continue-on-error: true
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          REPORT_FROM: ${{ secrets.REPORT_FROM }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_EVENT: ${{ github.event_name }}
        run: python tools/send_report.py
      # Every retry and failure of the run, one line each. Download it from the run's page
      # (Summary, Artifacts at the bottom). Kept 30 days.
      - name: Save the error log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 30
