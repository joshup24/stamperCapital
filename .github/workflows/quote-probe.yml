name: Quote timing probe (temporary)

# Measures when Alpha Vantage's quote catches up with the close, so the nightly refresh
# can be timed right. Ten checks per market day, 5 API calls each. Delete this workflow
# (and drop quote_probe) once the answer is in.
#
# Times are UTC and assume daylight saving (US market closes 4pm ET = 20:00 UTC); after
# November 1 the same cron times land an hour earlier in New York. The exact moment of each
# check is recorded in the table, so the late starts GitHub sometimes has do not matter.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * 1-5"    # 12:00 ET  during the session
    - cron: "30 19 * * 1-5"   #  3:30 ET  before the close
    - cron: "5 20 * * 1-5"    #  4:05 ET  just after the close
    - cron: "30 20 * * 1-5"   #  4:30 ET
    - cron: "0 21 * * 1-5"    #  5:00 ET
    - cron: "0 22 * * 1-5"    #  6:00 ET
    - cron: "0 23 * * 1-5"    #  7:00 ET
    - cron: "0 0 * * 2-6"     #  8:00 ET  (UTC date is the next day)
    - cron: "0 2 * * 2-6"     # 10:00 ET
    - cron: "0 5 * * 2-6"     #  1:00 ET  the next morning

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/requirements.txt
      - run: pip install -r ingest/requirements.txt
      - name: Probe
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python ingest/quote_probe.py
